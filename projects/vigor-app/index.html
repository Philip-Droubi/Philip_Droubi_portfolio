      <h1>Vigor App</h1>
      <p>Vigor is a university fitness platform project that combines home workouts, nutrition guidance, and a social network for trainers and trainees — offering a complete fitness experience in one place.</p>
      <h1 style="text-align: center;">Vigor Fitness Platform</h1><br><p>Vigor is a university project built to learn how to design and develop a complete, full‑featured platform. It combines home workouts, nutrition systems, and a social media experience for trainers, dietitians, and trainees — creating an all‑in‑one fitness ecosystem.</p><br><h2>1. What is Vigor?</h2><p>Vigor is a home workout and fitness application designed to help users exercise, follow diet plans, and stay healthy without needing to visit gyms or health centers. It also includes a built‑in social network that connects trainees with coaches and dietitians, making the experience more engaging and interactive.</p><br><h2>2. Key Features</h2><h3>• User System</h3><ul><li><p>Multiple roles: <strong>Admin, Managers, Coaches, Dietitians, Trainees</strong>.</p></li><li><p>Account creation via email or Google.</p></li><li><p>Advanced account management and profile customization.</p></li><li><p>OTP and email verification for high security.</p></li><li><p>Account deletion with 30‑day recovery.</p></li><li><p>Integrated notification &amp; email system.</p></li><li><p>Apply to become a coach or dietitian by submitting a CV.</p></li><li><p>Search across workouts, diets, challenges, users, and more.</p></li></ul><br><h3>• Workouts &amp; Diets System</h3><ul><li><p>Coaches can create and update structured workouts and challenges.</p></li><li><p>Dietitians can create and update detailed diet plans.</p></li><li><p>Trainees can subscribe, rate, and report workouts, challenges, and diets.</p></li><li><p>Uses device sensors for activity‑based challenges (walking, running, push‑ups).</p></li></ul><br><h3>• Social Network System</h3><ul><li><p>Coaches, Dietitians, and Admins can publish three types of posts: Multimedia posts, Multiple‑choice polls, Tips polls.</p></li><li><p>Follow or block other users.</p></li><li><p>Trainees can react, comment, save, or report posts.</p></li><li><p>Real‑time chat system included.</p></li></ul><br><h3>• Dashboards &amp; Control Panel</h3><ul><li><p>Full admin dashboard for managing the entire platform.</p></li><li><p>Ability to shut down the app or disable specific features.</p></li><li><p>Review reports, ban users, approve CVs, and more.</p></li><li><p>Periodic detailed analytics and system reports.</p></li></ul><br><p>Vigor represents a major learning milestone — a complete platform built from scratch, combining backend logic, user experience, and real‑world system design.</p>
      <p>Tech: Laravel, Git, MySQL</p>
