      <h1>Mova Car</h1>
      <p>MovaCar is a real-time taxi system in Syria that I worked on during my journey at Future Code as the Project Manager and Team Leader. It is considered one of the largest projects I developed and supervised.</p>
      <p><strong>MovaCar Taxi System (Laravel + Reverb)</strong></p><p>MovaCar is a real-time Syrian taxi platform developed during my journey at <strong>Future Code</strong>, where I served as the Project Manager and Team Leader.<br>The system targets yellow taxis and provides a fully interactive, real-time experience for both drivers and passengers.</p><br><p>I implemented real-time driver tracking using <strong>Laravel Reverb</strong>, enabling live location updates on the map. I also built a custom trip-sharing web page and delivered real-time updates for trip status, pricing, and driver movement.</p><br><ul><li><p>Real-time driver tracking with Laravel Reverb and live map updates</p></li><li><p>Custom trip-sharing page with dynamic session handling</p></li><li><p>Real-time updates for trip status, pricing, and driver movement</p></li><li><p>Integration with internal systems (POS, customer service, admin tools)</p></li><li><p>Contribution to a complex pricing engine (coupons, shifts, seasons, compensation)</p></li><li><p>Led the project as Project Manager &amp; Team Leader</p></li></ul><br>
      <p>Tech: Laravel, MySQL, PHP</p>
