      <h1>Kafo - Freelancing Platform</h1>
      <p>A graduation project built with Peak Link IT Company — a freelancing platform where I handled system analysis, backend development with Laravel, and the React.js user website.</p>
      <h1 style="text-align:center">Kafo Freelancing Platform</h1><br><p>Kafo is my 2024 graduation project, developed in collaboration with Peak Link IT Company.  It is a Syrian freelancing platform designed to improve communication and collaboration between freelancers and project owners, providing a structured and reliable environment for managing freelance work.</p><br><h2>1. My Role in the Project</h2><p>I was responsible for the system analysis and architectural design of the platform, ensuring a clear and scalable structure for all core features.  On the technical side, I developed the backend using the <strong>Laravel</strong> framework, implementing authentication, project workflows, user roles, and platform logic.  Additionally, I contributed to building the user-facing website using <strong>React.js</strong>, focusing on creating a clean, user-friendly interface.</p><br><h2>2. Project Overview</h2><p>Kafo aims to connect freelancers with clients in a smooth and organized way.  The platform supports project posting, bidding, communication, and progress tracking — all designed to make freelance collaboration more efficient and transparent.</p><br><h2>3. Collaboration With Peak Link IT Company</h2><p>This project was developed as part of an internship with Peak Link IT Company, giving me valuable real-world experience in professional software development.  Working with industry mentors helped refine my technical skills, improve my workflow, and understand how production-level systems are built and delivered.</p><br><p>Kafo represents a major milestone in my academic and professional journey — combining system analysis, backend engineering, and frontend development into a complete, real-world platform.</p>
      <p>Tech: Laravel, React JS, Tailwind CSS, TypeScript, Zustand, React Router, React Query, MySQL, Material UI, Axios</p>
