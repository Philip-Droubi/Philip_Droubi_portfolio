      <h1>Blind Care Association</h1>
      <p>Blind Care Association System is a full automation platform built to manage beneficiary registration, aid distribution, volunteer workflows, and communication for the Blind Care Association in Damascus.</p>
      <p></p><p><strong>The Blind Care Association System</strong> is a fully automated platform developed to replace the traditional paper‑based workflow used by the Blind Care Association in Damascus. I worked as a Backend Engineer using the Laravel framework, where the system includes an administration web application along with a dedicated Android application for beneficiaries.</p><p><br></p><p>The system enables registration and management of beneficiaries, volunteers, and staff, handling aid requests, recording donations, and organizing complete aid distribution operations. It also provides a dynamic evaluation system to classify beneficiaries based on need, an automated notification system for distribution events, and detailed reporting tools covering beneficiaries, donations, and financial activities.</p><p><br></p><p>During my volunteer period from March 2023 to January 2024, I played a key role in designing and implementing the backend architecture, ensuring accessibility for blind users, high performance, multi-layered security, and reliable communication through FCM notifications. The project was successfully delivered in November 2023, and I received an official recommendation letter from the Chairman of the Blind Care Association in recognition of my efforts and the positive impact of the system.</p><p><br></p><ul><li><p>Automated registration, aid requests, and beneficiary evaluations</p></li><li><p>Integrated aid distribution system with QR-based verification</p></li><li><p>Dynamic roles, permissions, and volunteer/staff management</p></li><li><p>Comprehensive reporting (PDF/Excel) for donations and beneficiaries</p></li><li><p>Android applications for beneficiaries and administrators</p></li><li><p>Accessibility support for blind users (screen reader compatibility)</p></li><li><p>Successfully delivered and supported by an official recommendation letter</p></li></ul><p><br></p>
      <p>Tech: Laravel, MySQL</p>
